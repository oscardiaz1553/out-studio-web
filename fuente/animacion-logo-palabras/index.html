<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Bricolage Grotesque"; src: url("assets/fonts/bricolage.woff2") format("woff2"); font-weight: 200 800; }
      @font-face { font-family: "Instrument Sans"; src: url("assets/fonts/instrument-500.woff2") format("woff2"); font-weight: 500; }
      :root { --paper:#F3EDE7; --klein:#1B2FCC; --deep:#141E5C; --soft:#C8CDF0; --mid:#4A55C4; --carne:#F2C6B4; --warm:#BC6039; }
      * { margin:0; padding:0; box-sizing:border-box; }
      html, body { width:1920px; height:1080px; overflow:hidden; background:var(--paper); }
      #main { position:relative; width:1920px; height:1080px; overflow:hidden; background:var(--paper); }
      #stage { position:absolute; left:0; top:0; width:1920px; height:1080px; transform-origin:960px 540px; }
      #bgc { position:absolute; left:-1500px; top:-1500px; width:4920px; height:4080px; background:var(--paper); }
      #wipe { position:absolute; left:-1500px; top:-1500px; width:4920px; height:4080px; background:var(--klein); clip-path:circle(0px at 2460px 2040px); }
      .grp { position:absolute; left:0; top:0; width:1920px; height:1080px; display:flex; align-items:center; justify-content:center; gap:34px; opacity:0; }
      .wd { font-family:"Bricolage Grotesque",sans-serif; font-weight:800; letter-spacing:-0.045em; font-size:240px; line-height:1; white-space:nowrap; padding-bottom:22px; }
      .ch { display:inline-block; }
      .bk { width:122px; height:300px; overflow:visible; }
      .bs { fill:none; stroke-width:9.4; stroke-linejoin:miter; stroke-miterlimit:10; stroke-linecap:butt; }
      #logoWrap { position:absolute; left:0; top:0; width:1920px; height:1080px; display:flex; align-items:center; justify-content:center; opacity:0; }
      #logoSvg { width:1100px; height:703px; overflow:visible; margin-top:-60px; }
      #tag { position:absolute; left:0; right:0; top:830px; text-align:center; font-family:"Bricolage Grotesque",sans-serif; font-weight:800; letter-spacing:-0.045em; font-size:96px; color:var(--klein); opacity:0; }
    </style>
  </head>
  <body>
    <div id="main" data-composition-id="main" data-start="0" data-duration="6.4" data-width="1920" data-height="1080">
      <div id="stage">
        <div id="bgc"></div>
        <div id="wipe"></div>

        <div class="grp" id="gr1" style="color:#1B2FCC"><svg class="bk" viewBox="18.58 21.7 19.61 48.4"><path id="p1l" fill="#BC6039" d="M21.37,32.32c-1.86,3.6-2.79,8.18-2.79,13.73,0,3.91,.49,7.37,1.48,10.38,.99,3.02,2.43,5.54,4.31,7.56,1.88,2.02,4.16,3.56,6.82,4.59,2.13,.83,4.46,1.33,7,1.48v-9.43c-.72-.15-1.39-.39-2.02-.7-1.28-.64-2.35-1.58-3.22-2.83-.87-1.24-1.52-2.82-1.94-4.73-.42-1.9-.64-4.08-.64-6.53,0-3.3,.38-6.05,1.13-8.26,.76-2.22,1.86-3.89,3.32-5.02,.98-.76,2.1-1.26,3.37-1.5v-9.42c-3.33,.27-6.35,1.13-9.05,2.59-3.32,1.79-5.91,4.48-7.77,8.09Z"/></svg><span class="wd" data-split>diseño</span><svg class="bk" viewBox="18.58 21.7 19.61 48.4"><g transform="matrix(-1 0 0 1 56.77 0)"><path id="p1r" fill="#BC6039" d="M21.37,32.32c-1.86,3.6-2.79,8.18-2.79,13.73,0,3.91,.49,7.37,1.48,10.38,.99,3.02,2.43,5.54,4.31,7.56,1.88,2.02,4.16,3.56,6.82,4.59,2.13,.83,4.46,1.33,7,1.48v-9.43c-.72-.15-1.39-.39-2.02-.7-1.28-.64-2.35-1.58-3.22-2.83-.87-1.24-1.52-2.82-1.94-4.73-.42-1.9-.64-4.08-.64-6.53,0-3.3,.38-6.05,1.13-8.26,.76-2.22,1.86-3.89,3.32-5.02,.98-.76,2.1-1.26,3.37-1.5v-9.42c-3.33,.27-6.35,1.13-9.05,2.59-3.32,1.79-5.91,4.48-7.77,8.09Z"/></g></svg></div>

        <div class="grp" id="gr2" style="color:#F3EDE7"><svg class="bk" viewBox="18.58 21.7 19.61 48.4"><path class="bs" stroke="#F2C6B4" d="M38.19,26.4 H23.28 V65.4 H38.19"/></svg><span class="wd" data-split>desarrollo</span><svg class="bk" viewBox="18.58 21.7 19.61 48.4"><g transform="matrix(-1 0 0 1 56.77 0)"><path class="bs" stroke="#F2C6B4" d="M38.19,26.4 H23.28 V65.4 H38.19"/></g></svg></div>

        <div class="grp" id="gr3" style="color:#141E5C"><svg class="bk" viewBox="18.58 21.7 19.61 48.4"><path class="bs" stroke="#1B2FCC" d="M38.19,26.4 H34 Q29,26.4 29,31.4 V40.9 Q29,45.9 23.3,45.9 Q29,45.9 29,50.9 V60.4 Q29,65.4 34,65.4 H38.19"/></svg><span class="wd" data-split>marca</span><svg class="bk" viewBox="18.58 21.7 19.61 48.4"><g transform="matrix(-1 0 0 1 56.77 0)"><path class="bs" stroke="#1B2FCC" d="M38.19,26.4 H34 Q29,26.4 29,31.4 V40.9 Q29,45.9 23.3,45.9 Q29,45.9 29,50.9 V60.4 Q29,65.4 34,65.4 H38.19"/></g></svg></div>

        <div class="grp" id="gr4" style="color:#F3EDE7"><svg class="bk" viewBox="18.58 21.7 19.61 48.4"><defs><clipPath id="c4"><rect x="18.58" y="21.7" width="19.61" height="48.4"/></clipPath></defs><g clip-path="url(#c4)"><path class="bs" stroke="#F2C6B4" d="M46,21 L23.3,45.9 L46,70.8"/></g></svg><span class="wd" data-split>tú</span><svg class="bk" viewBox="18.58 21.7 19.61 48.4"><g transform="matrix(-1 0 0 1 56.77 0)"><g clip-path="url(#c4)"><path class="bs" stroke="#F2C6B4" d="M46,21 L23.3,45.9 L46,70.8"/></g></g></svg></div>

        <div id="logoWrap"><svg id="logoSvg" viewBox="0 0 126.12 91.76"><g fill="#1B2FCC"><path id="lO" d="M29.19,72.04c-3.3,0-6.27-.52-8.93-1.55-2.66-1.04-4.93-2.57-6.82-4.59-1.88-2.02-3.32-4.54-4.31-7.56-.99-3.01-1.48-6.47-1.48-10.38,0-5.55,.93-10.13,2.79-13.74,1.86-3.6,4.45-6.3,7.77-8.09,3.32-1.79,7.12-2.68,11.41-2.68,3.34,0,6.33,.51,8.97,1.52,2.64,1.01,4.9,2.53,6.78,4.56,1.88,2.02,3.32,4.55,4.31,7.59,.99,3.04,1.48,6.56,1.48,10.56s-.52,7.6-1.55,10.66c-1.04,3.06-2.53,5.6-4.48,7.63-1.95,2.02-4.27,3.54-6.96,4.56-2.68,1.01-5.67,1.52-8.97,1.52Zm.42-9.25c2.17,0,3.98-.54,5.44-1.62,1.46-1.08,2.54-2.71,3.25-4.87,.71-2.16,1.06-4.85,1.06-8.05,0-3.44-.38-6.29-1.13-8.55-.75-2.26-1.87-3.98-3.35-5.16-1.48-1.18-3.35-1.77-5.61-1.77-2.12,0-3.91,.57-5.37,1.7-1.46,1.13-2.57,2.8-3.32,5.01-.75,2.21-1.13,4.97-1.13,8.26,0,2.45,.21,4.63,.64,6.53,.42,1.91,1.07,3.48,1.94,4.73,.87,1.25,1.94,2.19,3.21,2.82,1.27,.64,2.73,.95,4.38,.95Z"/><path id="lU" d="M65.42,72.04c-4.19,0-7.3-1.44-9.32-4.31-2.02-2.87-3.04-7.27-3.04-13.21v-20.76h11.44v20.27c0,2.92,.42,5.01,1.27,6.29s2.09,1.91,3.74,1.91c1.08,0,2.07-.28,2.97-.85,.89-.56,1.67-1.41,2.33-2.54,.66-1.13,1.15-2.53,1.48-4.2,.33-1.67,.49-3.61,.49-5.83v-15.04h11.44v37.29h-9.53l-.07-13.63h-.78c-.38,3.39-1.07,6.17-2.08,8.33-1.01,2.17-2.38,3.76-4.1,4.77-1.72,1.01-3.8,1.52-6.25,1.52Z"/><path id="lT" d="M113.05,65.87c0-1.83,.51-3.55,1.4-5.01-.59,.31-1.24,.55-1.94,.73-.73,.19-1.45,.28-2.15,.28-1.41,0-2.54-.37-3.39-1.13s-1.27-2-1.27-3.74v-14.05h8.69v-9.18h-8.69v-8.47h-6.57l-.05,1.36c-.02,.5-.06,1.01-.16,1.5-.36,1.89-1,2.57-2.01,3.47-1.21,1.09-2.99,1.85-5.49,2.13h-1.27l-.07,8.9h4.45v15.25c0,4.8,1.06,8.33,3.18,10.59,2.12,2.26,5.37,3.39,9.75,3.39,.9,0,1.92-.06,3.07-.18,1.14-.12,2.45-.38,3.93-.8-.9-1.48-1.42-3.21-1.42-5.06Z"/></g></svg></div>
        <div id="tag">Never the usual.</div>
      </div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      const E = "expo.out", P4 = "power4.out";

      function split(el) {
        const t = el.textContent; el.textContent = "";
        return [...t].map((c) => { const s = document.createElement("span"); s.className = "ch"; s.textContent = c; el.appendChild(s); return s; });
      }
      function flip(t, bg) {
        tl.set("#wipe", { backgroundColor: bg, clipPath: "circle(0px at 2460px 2040px)" }, t);
        tl.to("#wipe", { clipPath: "circle(3200px at 2460px 2040px)", duration: 0.45, ease: "power3.out" }, t);
        tl.set("#bgc", { backgroundColor: bg }, t + 0.47);
        tl.set("#wipe", { clipPath: "circle(0px at 2460px 2040px)" }, t + 0.47);
      }
      const cam = { s: 1, r: 0, sx: 0, sy: 0 };
      const apply = () => gsap.set("#stage", { scale: cam.s, rotation: cam.r, x: cam.sx, y: cam.sy });
      const shake = (t, a) => tl.to(cam, { keyframes: { sx: [0, -a, a * 0.8, -a * 0.5, a * 0.25, 0], sy: [0, a * 0.5, -a * 0.6, a * 0.3, -a * 0.1, 0] }, duration: 0.3, ease: "none", onUpdate: apply }, t);

      const beats = [
        { id: "#gr1", bg: "#F3EDE7", r: -5 },
        { id: "#gr2", bg: "#1B2FCC", r: 5 },
        { id: "#gr3", bg: "#F2C6B4", r: -4 },
        { id: "#gr4", bg: "#141E5C", r: 4 },
      ];
      beats.forEach((b, i) => {
        const t = 0.15 + i * 0.9;
        const g = document.querySelector(b.id);
        const [bl, , br] = [g.children[0], g.children[1], g.children[2]];
        const chars = split(g.querySelector("[data-split]"));
        if (i > 0) flip(t, b.bg);
        tl.set(b.id, { opacity: 1 }, t);
        tl.fromTo(bl, { x: -1100, scaleX: 1.6 }, { x: 0, scaleX: 1, duration: 0.5, ease: P4 }, t);
        tl.fromTo(br, { x: 1100, scaleX: 1.6 }, { x: 0, scaleX: 1, duration: 0.5, ease: P4 }, t);
        chars.forEach((c, k) => tl.fromTo(c, { y: 160, rotation: ((k * 53) % 21 - 10) * 2, opacity: 0, scale: 0.6 }, { y: 0, rotation: 0, opacity: 1, scale: 1, duration: 0.6, ease: "back.out(1.6)" }, t + 0.2 + k * 0.03));
        tl.fromTo(cam, { s: 1.22, r: b.r }, { s: 1, r: 0, duration: 0.7, ease: P4, onUpdate: apply, immediateRender: false }, t);
        shake(t + 0.3, 14);
        if (i < beats.length - 1) {
          tl.to(bl, { x: -300, opacity: 0, scaleX: 0.3, duration: 0.18, ease: "power3.in" }, t + 0.72);
          tl.to(br, { x: 300, opacity: 0, scaleX: 0.3, duration: 0.18, ease: "power3.in" }, t + 0.72);
          tl.to(g.children[1], { opacity: 0, y: -40, duration: 0.18, ease: "power2.in" }, t + 0.72);
          tl.set(b.id, { opacity: 0 }, t + 0.95);
        }
      });
      /* los corchetes de «tú» se cierran y el fondo se va a papel: aparece Out */
      const T = 0.15 + 3 * 0.9 + 0.8;
      const g4 = document.querySelector("#gr4");
      tl.to(g4.children[0], { x: 330, duration: 0.3, ease: "power4.in" }, T);
      tl.to(g4.children[2], { x: -330, duration: 0.3, ease: "power4.in" }, T);
      tl.to(g4.children[1], { scale: 0.2, opacity: 0, duration: 0.3, ease: "power4.in" }, T);
      flip(T + 0.28, "#F3EDE7");
      tl.set("#gr4", { opacity: 0 }, T + 0.5);
      tl.set("#logoWrap", { opacity: 1 }, T + 0.3);
      tl.fromTo("#logoSvg", { scale: 0.3, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.7, ease: "back.out(1.8)", immediateRender: false }, T + 0.3);
      shake(T + 0.3, 24);
      tl.fromTo(cam, { s: 1.15, r: -3 }, { s: 1, r: 0, duration: 0.7, ease: P4, onUpdate: apply, immediateRender: false }, T + 0.3);
      const tag = document.getElementById("tag");
      const tx = tag.textContent; tag.textContent = "";
      tl.set("#tag", { opacity: 1 }, T + 0.85);
      [...tx].forEach((ch, i) => {
        const sp = document.createElement("span"); sp.className = "ch"; sp.textContent = ch === " " ? " " : ch; tag.appendChild(sp);
        tl.fromTo(sp, { y: 120, rotation: ((i * 53) % 21 - 10) * 2, opacity: 0 }, { y: 0, rotation: 0, opacity: 1, duration: 0.6, ease: "back.out(1.7)" }, T + 0.85 + i * 0.03);
      });
      gsap.set("#tag", { opacity: 0 });
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
