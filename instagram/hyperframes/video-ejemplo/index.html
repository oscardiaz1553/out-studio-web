<!doctype html>
<html lang="es" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Bricolage Grotesque"; src: url("assets/fonts/bricolage.woff2") format("woff2"); font-weight: 200 800; }
      @font-face { font-family: "Instrument Sans"; src: url("assets/fonts/instrument-400.woff2") format("woff2"); font-weight: 400; }
      @font-face { font-family: "Instrument Sans"; src: url("assets/fonts/instrument-500.woff2") format("woff2"); font-weight: 500; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: #1b2fcc; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: #1b2fcc; font-family: "Instrument Sans", sans-serif; }
      .scene { position: absolute; inset: 0; }
      .d { font-family: "Bricolage Grotesque", sans-serif; font-weight: 800; letter-spacing: -0.04em; line-height: 1; }
      #dots { position: absolute; inset: 0; opacity: 0.5; }
      .dot { position: absolute; width: 10px; height: 10px; margin: -5px 0 0 -5px; border-radius: 50%; background: #4a55c4; }

      /* Nombre arriba */
      #lt { position: absolute; left: 70px; top: 96px; display: flex; align-items: center; gap: 22px; }
      #lt-bar { width: 10px; height: 78px; border-radius: 5px; background: #f5e3b3; }
      #lt-name { display: block; font-size: 54px; color: #fbf8f5; }
      #lt-role { display: block; margin-top: 6px; font-size: 30px; font-weight: 500; color: #f5e3b3; }

      /* Pantalla */
      #card { position: absolute; left: 110px; top: 250px; width: 860px; height: 1000px; border-radius: 40px; overflow: hidden; background: #0d1440; box-shadow: 0 30px 0 0 #141e5c; }
      .page { position: absolute; left: 0; top: 0; width: 860px; }
      .page img { display: block; width: 860px; height: auto; }
      #pg-a { height: 1529px; }
      #pg-b { height: 1389px; opacity: 0; }
      .mark { position: absolute; border: 9px solid #f5e3b3; border-radius: 22px; box-shadow: 0 0 0 6px #1b2fcc; opacity: 0; }
      .tag { position: absolute; padding: 12px 26px; border-radius: 999px; background: #f5e3b3; color: #141e5c; font-size: 34px; font-weight: 500; white-space: nowrap; opacity: 0; }
      #state, #state2 { position: absolute; right: 24px; top: 24px; padding: 12px 28px; border-radius: 999px; background: #141e5c; color: #f5e3b3; font-size: 34px; font-weight: 500; opacity: 0; }

      /* Círculo de cámara */
      #cam { position: absolute; left: 60px; top: 1120px; width: 260px; height: 260px; border-radius: 50%; background: #141e5c; border: 10px solid #f5e3b3; display: flex; align-items: center; justify-content: center; text-align: center; color: #f5e3b3; font-size: 34px; font-weight: 500; line-height: 1.15; opacity: 0; }

      /* Subtítulos */
      .cap { position: absolute; left: 70px; right: 70px; top: 1440px; height: 290px; display: flex; align-items: flex-start; opacity: 0; }
      .cap p { font-family: "Bricolage Grotesque", sans-serif; font-weight: 800; letter-spacing: -0.035em; line-height: 1.06; font-size: 78px; color: #fbf8f5; }
      .cap .w { display: inline-block; margin-right: 0.28em; opacity: 0; }
      .cap .k { color: #f5e3b3; }
      #cap-lead { left: 340px; }

      /* Cierre */
      #wipe { position: absolute; inset: 0; background: #f3ede7; clip-path: circle(0px at 540px 760px); }
      #end-logo { position: absolute; left: 340px; top: 330px; width: 400px; height: auto; opacity: 0; }
      #end-never { position: absolute; left: 0; right: 0; top: 650px; text-align: center; font-size: 60px; color: #bc6039; opacity: 0; }
      #end-q { position: absolute; left: 90px; right: 90px; top: 790px; text-align: center; font-size: 112px; color: #141e5c; }
      #end-q .w { display: inline-block; margin: 0 0.12em; opacity: 0; }
      #end-btn { position: absolute; left: 50%; top: 1130px; margin-left: -250px; width: 500px; padding: 28px 0; border-radius: 999px; background: #1b2fcc; color: #f3ede7; text-align: center; font-size: 46px; font-weight: 500; opacity: 0; }
      #end-mono { position: absolute; right: 50px; bottom: -40px; width: 470px; height: auto; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="27" data-width="1080" data-height="1920">
      <div id="dots"></div>

      <div id="s1" class="scene clip" data-start="0" data-duration="23.6" data-track-index="1">
        <div id="lt">
          <div id="lt-bar"></div>
          <div>
            <span id="lt-name" class="d">Oscar Díaz</span>
            <span id="lt-role">Out Studio · Diseño UX/UI y desarrollo web</span>
          </div>
        </div>

        <div id="card">
          <div id="pg-a" class="page" data-layout-allow-overflow>
            <img src="assets/antes.jpg" alt="" />
            <div id="m1" class="mark" style="left: 8px; top: 8px; width: 844px; height: 654px"></div>
            <div id="t1" class="tag" style="left: 40px; top: 590px">Encabezado enorme</div>
            <div id="m2" class="mark" style="left: 522px; top: 586px; width: 336px; height: 284px"></div>
            <div id="t2" class="tag" style="left: 300px; top: 880px">Anuncio sobre el texto</div>
            <div id="m3" class="mark" style="left: 8px; top: 1268px; width: 844px; height: 252px"></div>
            <div id="t3" class="tag" style="left: 40px; top: 1200px">Banner que tapa la pantalla</div>
          </div>
          <div id="pg-b" class="page" data-layout-allow-overflow>
            <img src="assets/despues.jpg" alt="" />
            <div id="m4" class="mark" style="left: 12px; top: 372px; width: 836px; height: 252px"></div>
            <div id="t4" class="tag" style="left: 260px; top: 258px">Cada cosa en su lugar</div>
          </div>
          <div id="state" class="d">Antes</div>
          <div id="state2" class="d">Después</div>
        </div>

        <div id="cam">Tu cámara<br />aquí</div>

        <div id="cap1" class="cap"><p></p></div>
        <div id="cap2" class="cap"><p></p></div>
        <div id="cap3" class="cap"><p></p></div>
        <div id="cap4" class="cap"><p></p></div>
        <div id="cap5" class="cap"><p></p></div>
        <div id="cap6" class="cap"><p></p></div>
      </div>

      <div id="s2" class="scene clip" data-start="23.4" data-duration="3.6" data-track-index="2">
        <div id="wipe"></div>
        <svg id="end-logo" viewBox="0 0 126.12 91.76"><path fill="#1b2fcc" d="M29.19,72.04c-3.3,0-6.27-.52-8.93-1.55-2.66-1.04-4.93-2.57-6.82-4.59-1.88-2.02-3.32-4.54-4.31-7.56-.99-3.01-1.48-6.47-1.48-10.38,0-5.55,.93-10.13,2.79-13.74,1.86-3.6,4.45-6.3,7.77-8.09,3.32-1.79,7.12-2.68,11.41-2.68,3.34,0,6.33,.51,8.97,1.52,2.64,1.01,4.9,2.53,6.78,4.56,1.88,2.02,3.32,4.55,4.31,7.59,.99,3.04,1.48,6.56,1.48,10.56s-.52,7.6-1.55,10.66c-1.04,3.06-2.53,5.6-4.48,7.63-1.95,2.02-4.27,3.54-6.96,4.56-2.68,1.01-5.67,1.52-8.97,1.52Zm.42-9.25c2.17,0,3.98-.54,5.44-1.62,1.46-1.08,2.54-2.71,3.25-4.87,.71-2.16,1.06-4.85,1.06-8.05,0-3.44-.38-6.29-1.13-8.55-.75-2.26-1.87-3.98-3.35-5.16-1.48-1.18-3.35-1.77-5.61-1.77-2.12,0-3.91,.57-5.37,1.7-1.46,1.13-2.57,2.8-3.32,5.01-.75,2.21-1.13,4.97-1.13,8.26,0,2.45,.21,4.63,.64,6.53,.42,1.91,1.07,3.48,1.94,4.73,.87,1.25,1.94,2.19,3.21,2.82,1.27,.64,2.73,.95,4.38,.95Z" /><path fill="#1b2fcc" d="M65.42,72.04c-4.19,0-7.3-1.44-9.32-4.31-2.02-2.87-3.04-7.27-3.04-13.21v-20.76h11.44v20.27c0,2.92,.42,5.01,1.27,6.29s2.09,1.91,3.74,1.91c1.08,0,2.07-.28,2.97-.85,.89-.56,1.67-1.41,2.33-2.54,.66-1.13,1.15-2.53,1.48-4.2,.33-1.67,.49-3.61,.49-5.83v-15.04h11.44v37.29h-9.53l-.07-13.63h-.78c-.38,3.39-1.07,6.17-2.08,8.33-1.01,2.17-2.38,3.76-4.1,4.77-1.72,1.01-3.8,1.52-6.25,1.52Z" /><path fill="#1b2fcc" d="M113.05,65.87c0-1.83,.51-3.55,1.4-5.01-.59,.31-1.24,.55-1.94,.73-.73,.19-1.45,.28-2.15,.28-1.41,0-2.54-.37-3.39-1.13s-1.27-2-1.27-3.74v-14.05h8.69v-9.18h-8.69v-8.47h-6.57l-.05,1.36c-.02,.5-.06,1.01-.16,1.5-.36,1.89-1,2.57-2.01,3.47-1.21,1.09-2.99,1.85-5.49,2.13h-1.27l-.07,8.9h4.45v15.25c0,4.8,1.06,8.33,3.18,10.59,2.12,2.26,5.37,3.39,9.75,3.39,.9,0,1.92-.06,3.07-.18,1.14-.12,2.45-.38,3.93-.8-.9-1.48-1.42-3.21-1.42-5.06Z" /></svg>
        <div id="end-never" class="d">Never the usual.</div>
        <div id="end-q" class="d"><span class="w">¿Quieres</span><span class="w">que</span><span class="w">revise</span><span class="w">la</span><span class="w">tuya?</span></div>
        <div id="end-btn">outstudio.online</div>
        <img id="end-mono" src="assets/mono-laptop.webp" alt="" />
      </div>
    </div>

    <script>
      const lat = document.getElementById("dots");
      for (let r = 0; r < 20; r++)
        for (let c = 0; c < 12; c++) {
          const d = document.createElement("div");
          d.className = "dot";
          d.style.left = c * 100 - 10 + (r % 2 ? 50 : 0) + "px";
          d.style.top = r * 100 + "px";
          lat.appendChild(d);
        }

      /* Subtítulos: [id, inicio, fin, texto con *clave*] */
      const CAPS = [
        ["cap1", 0.4, 3.2, "Revisé una *página* en *60 segundos.*"],
        ["cap2", 3.5, 7.2, "Primero: el *encabezado* se come casi toda la primera pantalla."],
        ["cap3", 7.5, 11.4, "Segundo: un *anuncio* tapa justo lo que quieres leer."],
        ["cap4", 11.7, 15.5, "Tercero: otro *banner* tapa la pantalla de abajo."],
        ["cap5", 15.9, 19.9, "Ordenar lo cambia todo: lo *importante* al frente y la *publicidad* en su lugar."],
        ["cap6", 20.3, 23.3, "Si quieres que revise la tuya, *escríbeme.*"],
      ];
      const caps = CAPS.map(([id, t0, t1, text]) => {
        const p = document.getElementById(id).querySelector("p");
        const words = [];
        text.split(" ").forEach((raw) => {
          // las claves pueden abarcar varias palabras: *a b*
          words.push(raw);
        });
        let key = false;
        const spans = [];
        words.forEach((w) => {
          let t = w;
          const open = t.startsWith("*");
          if (open) { key = true; t = t.slice(1); }
          const close = t.endsWith("*");
          if (close) t = t.slice(0, -1);
          const s = document.createElement("span");
          s.className = "w" + (key ? " k" : "");
          s.textContent = t;
          p.appendChild(s);
          p.appendChild(document.createTextNode(" "));
          spans.push(s);
          if (close) key = false;
        });
        return { id, t0, t1, spans };
      });

      const tl = gsap.timeline({ paused: true });
      const E = "power3.out";

      /* Nombre y tarjeta */
      tl.fromTo("#lt", { x: -60, opacity: 0 }, { x: 0, opacity: 1, duration: 0.5, ease: E }, 0.1);
      tl.fromTo("#card", { y: 160, opacity: 0, scale: 0.94 }, { y: 0, opacity: 1, scale: 1, duration: 0.7, ease: "back.out(1.4)" }, 0.15);
      tl.fromTo("#state", { scale: 0.4, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.4, ease: "back.out(2.4)" }, 0.8);
      tl.fromTo("#cam", { scale: 0.2, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.5, ease: "back.out(2)" }, 0.5);

      /* Subtítulos palabra por palabra */
      caps.forEach(({ id, t0, t1, spans }) => {
        const lead = id === "cap1" || id === "cap6" ? 0 : 0;
        tl.set(`#${id}`, { opacity: 1 }, t0);
        const span = (t1 - t0) * 0.62;
        spans.forEach((s, i) => {
          tl.fromTo(s, { y: 34, opacity: 0, scale: 0.9 }, { y: 0, opacity: 1, scale: 1, duration: 0.28, ease: "back.out(2)" }, t0 + lead + (span * i) / Math.max(1, spans.length - 1));
        });
        tl.to(`#${id}`, { opacity: 0, y: -24, duration: 0.2, ease: "power2.in" }, t1 - 0.2);
        tl.set(`#${id}`, { opacity: 0 }, t1);
      });

      /* Marcas (cada una entra con su subtítulo) */
      const mark = (m, t, tg, t0) => {
        tl.fromTo(m, { opacity: 0, scale: 1.12 }, { opacity: 1, scale: 1, duration: 0.35, ease: "back.out(2)" }, t0);
        tl.fromTo(tg, { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.3, ease: E }, t0 + 0.15);
        tl.to([m, tg], { opacity: 0, duration: 0.25 }, t);
      };
      mark("#m1", 7.3, "#t1", 3.9);
      mark("#m2", 11.5, "#t2", 7.9);
      mark("#m3", 15.5, "#t3", 12.4);

      /* Desplazamiento de la página */
      tl.to("#pg-a", { y: -529, duration: 1.4, ease: "power2.inOut" }, 11.8);

      /* Después */
      tl.to("#pg-a", { opacity: 0, duration: 0.3 }, 15.6);
      tl.fromTo("#pg-b", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.4, ease: E }, 15.7);
      tl.to("#state", { opacity: 0, duration: 0.15 }, 15.6);
      tl.fromTo("#state2", { scale: 0.5, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.4, ease: "back.out(2.4)" }, 15.8);
      tl.to("#pg-b", { y: -120, duration: 3.6, ease: "sine.inOut" }, 16.1);
      tl.fromTo("#m4", { opacity: 0, scale: 1.08 }, { opacity: 1, scale: 1, duration: 0.35, ease: "back.out(2)" }, 17.6);
      tl.fromTo("#t4", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.3, ease: E }, 17.75);

      /* La cámara respira cuando habla Oscar */
      tl.to("#cam", { scale: 1.08, duration: 0.5, ease: "sine.inOut", yoyo: true, repeat: 5 }, 20.3);

      /* Cierre */
      tl.to("#s1", { opacity: 0, duration: 0.25, ease: "power2.in" }, 23.35);
      tl.to("#wipe", { clipPath: "circle(1400px at 540px 760px)", duration: 0.6, ease: "power3.inOut" }, 23.45);
      tl.fromTo("#end-logo", { scale: 0.2, opacity: 0, rotation: -10 }, { scale: 1, opacity: 1, rotation: 0, duration: 0.5, ease: "back.out(2.2)" }, 23.8);
      tl.fromTo("#end-never", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.4, ease: E }, 24.15);
      tl.fromTo("#end-q .w", { y: 40, opacity: 0 }, { y: 0, opacity: 1, duration: 0.3, ease: "back.out(2)", stagger: 0.07 }, 24.35);
      tl.fromTo("#end-btn", { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.45, ease: "back.out(2.6)" }, 24.9);
      tl.fromTo("#end-mono", { y: 700, rotation: 8 }, { y: 0, rotation: 0, duration: 0.7, ease: "back.out(1.6)" }, 24.7);

      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
