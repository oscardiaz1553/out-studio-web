    <style>

      @font-face { font-family: "Instrument Sans"; src: url("assets/fonts/instrument-400.woff2") format("woff2"); font-weight: 400; }
      @font-face { font-family: "Instrument Sans"; src: url("assets/fonts/instrument-500.woff2") format("woff2"); font-weight: 500; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: #1b2fcc; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; font-family: "Instrument Sans", sans-serif; }

      /* Fondo: color base + barrido circular para cada cambio de escena */
      #bg { position: absolute; inset: 0; background: #1b2fcc; }
      #wipe { position: absolute; inset: 0; background: #f3ede7; clip-path: polygon(0% 100%, 100% 120%, 100% 120%, 0% 100%); }

      /* Cámara: todo lo que se mueve con ella */
      #cam { position: absolute; inset: 0; transform-origin: 540px 960px; --dot: #4a55c4; }
      #lattice { position: absolute; left: -540px; top: -960px; width: 2160px; height: 3840px; }
      .dot { position: absolute; width: 10px; height: 10px; margin: -5px 0 0 -5px; border-radius: 50%; background: var(--dot); opacity: 0.55; }

      .scene { position: absolute; inset: 0; }
      .sl { position: absolute; left: 0; height: 10px; width: 1100px; border-radius: 5px; background: #f5e3b3; opacity: 0; }
      .bu { position: absolute; left: 0; top: 0; width: 120px; height: 120px; opacity: 0; }
      .bu svg { display: block; width: 100%; height: 100%; overflow: visible; }
      .bu path { fill: none; stroke: currentColor; stroke-width: 9.4; stroke-linejoin: miter; stroke-miterlimit: 10; }
      .d { font-family: "Bricolage Grotesque", sans-serif; font-weight: 800; letter-spacing: -0.045em; line-height: 0.94; }
      .w { display: inline-block; }
      .ch { display: inline-block; }
      .sym { display: block; height: 100%; width: auto; overflow: visible; }
      .sym path { fill: none; stroke-width: 9.4; stroke-linejoin: miter; stroke-miterlimit: 10; stroke-linecap: butt; }
      .flip { transform: scaleX(-1); }
      .pair { position: absolute; display: flex; justify-content: center; }
      .half { height: 100%; }

      /* Líneas de velocidad (fuera de la cámara) */

      /* Escena 1 · gancho */
      #s1-title { position: absolute; left: 80px; right: 80px; top: 330px; color: #1b2fcc; }
      #s1-title .big { font-size: 220px; display: block; }
      #s1-title .mid { font-size: 108px; display: block; color: #141e5c; margin-top: 18px; }
      #s1-title .acc { font-size: 150px; display: block; color: #bc6039; margin-top: 10px; }
      #s1-mono { position: absolute; right: -6px; bottom: 250px; width: 760px; }

      /* Escena 2 · celular */

      .pg-hero { height: 120px; border-radius: 8px; background: #1b2fcc; margin: 14px 0 16px; }
      .pg-row { display: flex; gap: 8px; margin-top: 14px; }
      .pg-tile { flex: 1; height: 70px; border-radius: 6px; background: #f5e3b3; }
      .finger { position: absolute; width: 70px; height: 70px; border-radius: 50%; background: rgba(20, 30, 92, 0.35); border: 5px solid #141e5c; opacity: 0; }

      /* Escena 3 · carga */

      #s3-l2 { position: absolute; left: 80px; right: 80px; top: 1440px; font-size: 98px; color: #fbf8f5; }
      #s3-l2 .ab { color: #f5e3b3; white-space: nowrap; display: inline-block; }
      #browser { position: absolute; left: 110px; top: 690px; width: 860px; height: 600px; border-radius: 30px; background: #fbf8f5; overflow: hidden; }
      #browser .top { height: 64px; background: #f3ede7; display: flex; align-items: center; gap: 12px; padding: 0 26px; }
      #browser .top i { width: 18px; height: 18px; border-radius: 50%; background: #c9c3bd; display: block; }

    <script>
      /* Partir en letras los textos marcados con .split (para rebotes por letra). */
      document.querySelectorAll(".split").forEach((el) => {
        const text = el.textContent;
        el.textContent = "";
        for (const c of text) {
          const s = document.createElement("span");
          s.className = "ch";
          s.textContent = c === " " ? "\u00a0" : c;
          el.appendChild(s);
        }
      });

      /* Retícula de puntos (determinística) */
      const lat = document.getElementById("lattice");
      for (let r = 0; r < 70; r++)
        for (let c = 0; c < 40; c++) {
          const d = document.createElement("div");
          d.className = "dot";
          d.style.left = 28 + c * 56 + "px";
          d.style.top = 28 + r * 56 + "px";
          lat.appendChild(d);
        }

      const tl = gsap.timeline({ paused: true });
      const P4 = "power4.out", E = "expo.out", EI = "expo.inOut";
      const TOTAL = 16.6;

      /* ── Cámara: un solo escritor del transform, con fase + deriva + sacudida ── */
      const camEl = document.getElementById("cam");
      const cam = { s: 2.4, r: -6, x: 0, y: 0, sx: 0, sy: 0, d: 0 };
      const apply = () => {
        const dx = Math.sin(cam.d) * 7, dy = Math.sin(cam.d * 1.3) * 9;
        camEl.style.transform = `translate(${cam.x + cam.sx + dx}px, ${cam.y + cam.sy + dy}px) rotate(${cam.r}deg) scale(${cam.s})`;
      };
      const move = (vars, t) => tl.to(cam, { ...vars, onUpdate: apply }, t);
      const shake = (t, a) =>
        tl.to(cam, { keyframes: { sx: [0, -a, a * 0.8, -a * 0.5, a * 0.25, 0], sy: [0, a * 0.5, -a * 0.6, a * 0.3, -a * 0.1, 0] }, duration: 0.32, ease: "none", onUpdate: apply }, t);
      tl.to(cam, { d: Math.PI * 2 * 3, duration: TOTAL, ease: "none", onUpdate: apply }, 0);
      apply();

      /* Piezas de la explosión: medio símbolo de la marca cada una ( [ { < ) */
      const BURST_PATHS = [
        ["18.58 21.7 19.61 48.4", "M38.19,26.4 H23.28 V65.4 H38.19"],
        ["18.58 21.7 19.61 48.4", "M38.19,26.4 H34 Q29,26.4 29,31.4 V40.9 Q29,45.9 23.3,45.9 Q29,45.9 29,50.9 V60.4 Q29,65.4 34,65.4 H38.19"],
        ["19 18 30 56", "M46,21 L23.3,45.9 L46,70.8"],
      ];
      const burstHost = document.getElementById("burst");
      const bursts = [];
      for (let i = 0; i < 10; i++) {
        const [vb, d] = BURST_PATHS[i % 3];
        const el = document.createElement("div");
        el.className = "bu";
        el.innerHTML = `<svg viewBox="${vb}"><path d="${d}" /></svg>`;
        burstHost.appendChild(el);
        bursts.push(el);
      }

      /* Cambio de fondo: barrido en diagonal (alterna desde abajo y desde un lado) */
      let flips = 0;
      const WIPES = [
        ["polygon(0% 100%, 100% 118%, 100% 118%, 0% 100%)", "polygon(0% -18%, 100% 0%, 100% 118%, 0% 100%)"],
        ["polygon(118% 0%, 118% 0%, 100% 100%, 100% 100%)", "polygon(0% 0%, 118% 0%, 100% 100%, -18% 100%)"],
        ["polygon(0% 0%, 0% 0%, -18% 100%, -18% 100%)", "polygon(0% 0%, 118% 0%, 100% 100%, -18% 100%)"],
      ];
      function flip(t, color, cx, cy, dot) {
        const [from, to] = WIPES[flips++ % WIPES.length];
        tl.set("#wipe", { backgroundColor: color, clipPath: from }, t);
        tl.to("#wipe", { clipPath: to, duration: 0.45, ease: "power3.inOut" }, t);
        tl.set("#bg", { backgroundColor: color }, t + 0.47);
        tl.set("#wipe", { clipPath: WIPES[0][0] }, t + 0.47);
        tl.set("#cam", { "--dot": dot }, t);
      }
      /* Golpe: los símbolos salen disparados girando desde el punto del impacto */
      function boom(t, cx, cy, color, size, dur) {
        const D = ((size || 9) / 9) * 330;
        bursts.forEach((el, i) => {
          const a = (i / bursts.length) * Math.PI * 2 + 0.35;
          const k = i % 2 ? 1 : 0.72;
          tl.set(el, { x: cx - 60, y: cy - 60, color, opacity: 1, scale: 0.3, rotation: 0 }, t);
          tl.to(el, { x: cx - 60 + Math.cos(a) * D * k, y: cy - 60 + Math.sin(a) * D * k, rotation: (i % 2 ? 1 : -1) * 140, scale: 1.1, opacity: 0, duration: dur || 0.58, ease: "power3.out" }, t);
        });
        shake(t, 18);
      }
      /* Líneas de velocidad en la salida de cada escena */
      function speed(t) {
        ["#sl1", "#sl2", "#sl3", "#sl4"].forEach((id, i) => {
          tl.fromTo(id, { x: -1200, opacity: 0.95 }, { x: 1300, opacity: 0.95, duration: 0.38, ease: "power2.in", immediateRender: false }, t + i * 0.045);
          tl.set(id, { opacity: 0 }, t + 0.6);
        });
      }
      /* ── Palabras que caen con rebote ── */
      const dropWords = (sel, t, st) =>
        tl.fromTo(`${sel} .w`, { y: -140, rotation: -12, opacity: 0 }, { y: 0, rotation: 0, opacity: 1, duration: 0.55, ease: "back.out(2.2)", stagger: st || 0.07 }, t);
      const popWords = (sel, t, st) =>
        tl.fromTo(`${sel} .w`, { scale: 0.2, opacity: 0, y: 40 }, { scale: 1, opacity: 1, y: 0, duration: 0.5, ease: "back.out(2.6)", stagger: st || 0.06, transformOrigin: "50% 80%" }, t);
      const slamWords = (sel, t) =>
        tl.fromTo(`${sel} .w`, { scale: 1.8, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.42, ease: P4, stagger: 0.07 }, t);
      const waveLetters = (sel, t) =>
        tl.fromTo(`${sel} .ch`, { y: 90, rotation: 18, opacity: 0 }, { y: 0, rotation: 0, opacity: 1, duration: 0.5, ease: "back.out(2.4)", stagger: 0.035 }, t);

      /* ════ ESCENA 1 · 0–3.3 · el gancho ════ */
      tl.set("#cam", { "--dot": "#4a55c4" }, 0);
      tl.fromTo("#s1-bl", { x: -150 }, { x: -12, duration: 0.45, ease: "power3.in" }, 0.05);
      tl.fromTo("#s1-brr", { x: 150 }, { x: 12, duration: 0.45, ease: "power3.in" }, 0.05);
      flip(0.5, "#f3ede7", 540, 960, "#d9d1c8");
      boom(0.5, 540, 960, "#f5e3b3", 11);
      move({ s: 1, r: 0, duration: 0.95, ease: P4 }, 0.5);
      tl.to("#s1-bl", { x: -700, opacity: 0, scaleX: 0.3, duration: 0.3, ease: "power3.in" }, 0.62);
      tl.to("#s1-brr", { x: 700, opacity: 0, scaleX: 0.3, duration: 0.3, ease: "power3.in" }, 0.62);
      dropWords("#s1-title .big", 0.7, 0.09);
      dropWords("#s1-title .mid", 1.0, 0.06);
      waveLetters("#s1-title .acc", 1.45);
      tl.fromTo("#s1-mono", { x: 520, rotation: 10 }, { x: 0, rotation: 0, duration: 0.7, ease: "back.out(1.8)" }, 1.75);
      move({ s: 1.07, r: -2.5, duration: 1.1, ease: "sine.inOut" }, 1.9);
      tl.to("#s1-mono", { rotation: -4, duration: 0.25, ease: "sine.inOut", yoyo: true, repeat: 3 }, 2.45);
      /* salida: látigo de cámara */
      speed(2.95);
      move({ s: 1.5, r: 9, x: -260, duration: 0.35, ease: "power3.in" }, 2.95);

      /* ════ ESCENA 2 · 3.25–6.6 · tienes que hacer zoom ════ */
      flip(3.25, "#f5e3b3", 900, 1000, "#e6cf98");
      move({ s: 1.35, r: -5, x: 0, duration: 0.01, ease: "none" }, 3.3);
      move({ s: 1, r: 0, duration: 0.8, ease: E }, 3.32);
      tl.fromTo("#phone", { y: 1100, rotation: -14 }, { y: 0, rotation: -3, duration: 0.75, ease: "back.out(1.5)" }, 3.3);
      tl.fromTo("#s2-bl", { x: -300, opacity: 0, scaleX: 1.4 }, { x: 0, opacity: 1, scaleX: 1, duration: 0.35, ease: P4 }, 3.55);
      tl.fromTo("#s2-brr", { x: 300, opacity: 0, scaleX: 1.4 }, { x: 0, opacity: 1, scaleX: 1, duration: 0.35, ease: P4 }, 3.55);
      boom(3.6, 540, 1020, "#1b2fcc", 7);
      popWords("#s2-l1", 3.6);
      /* el gesto de pellizcar: dos dedos se separan y la página se agranda */
      tl.fromTo("#f1", { x: 120, y: 280, opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.2, ease: P4 }, 4.35);
      tl.fromTo("#f2", { x: 160, y: 320, opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.2, ease: P4 }, 4.35);
      tl.to("#f1", { x: 40, y: 190, duration: 0.55, ease: "power2.inOut" }, 4.55);
      tl.to("#f2", { x: 240, y: 420, duration: 0.55, ease: "power2.inOut" }, 4.55);
      tl.fromTo("#page", { scale: 1 }, { scale: 2.8, duration: 0.6, ease: "power2.inOut" }, 4.55);
      move({ s: 2.05, r: 4, x: 0, y: -110, duration: 0.6, ease: EI }, 4.5);
      tl.to(["#f1", "#f2"], { opacity: 0, duration: 0.15 }, 5.15);
      move({ s: 1, r: 0, y: 0, duration: 0.55, ease: "back.out(1.6)" }, 5.35);
      tl.to("#phone", { rotation: 3, duration: 0.5, ease: "back.out(2)" }, 5.35);
      slamWords("#s2-l2", 5.5);
      shake(5.62, 22);
      /* salida */
      tl.to("#s2-bl", { x: -300, opacity: 0, scaleX: 0.3, duration: 0.22, ease: "power3.in" }, 6.3);
      tl.to("#s2-brr", { x: 300, opacity: 0, scaleX: 0.3, duration: 0.22, ease: "power3.in" }, 6.3);
      speed(6.25);
      move({ s: 0.75, r: -10, duration: 0.3, ease: "power3.in" }, 6.3);

      /* ════ ESCENA 3 · 6.55–9.95 · la carga eterna ════ */
      flip(6.55, "#141e5c", 540, 990, "#2a3678");
      move({ s: 1.3, r: 6, duration: 0.01, ease: "none" }, 6.58);
      move({ s: 1, r: 0, duration: 0.8, ease: E }, 6.6);
      tl.fromTo("#browser", { scale: 0.4, rotation: 8, opacity: 0 }, { scale: 1, rotation: 0, opacity: 1, duration: 0.6, ease: "back.out(1.8)" }, 6.6);
      dropWords("#s3-l1", 6.85, 0.08);
      tl.fromTo("#s3-cl", { x: -120, opacity: 0 }, { x: 0, opacity: 1, duration: 0.3, ease: P4 }, 7.0);
      tl.fromTo("#s3-cr", { x: 120, opacity: 0 }, { x: 0, opacity: 1, duration: 0.3, ease: P4 }, 7.0);
      tl.fromTo("#spin", { rotation: 0 }, { rotation: 360 * 5, duration: 2.9, ease: "none" }, 6.95);
      /* barra que avanza a trompicones y se queda pegada */
      const load = { p: 0 };
      tl.fromTo("#fill", { scaleX: 0 }, { scaleX: 0.13, duration: 2.2, ease: "none", keyframes: { scaleX: [0, 0.06, 0.07, 0.11, 0.12, 0.13, 0.13] } }, 7.1);
      tl.fromTo(load, { p: 0 }, { p: 13, duration: 2.2, ease: "none", keyframes: { p: [0, 6, 7, 11, 12, 13, 13] }, onUpdate: () => { document.getElementById("pct").textContent = Math.round(load.p) + "%"; } }, 7.1);
      move({ s: 1.12, duration: 2.2, ease: "sine.inOut" }, 7.2);
      tl.fromTo("#s3-mono", { y: 420, rotation: 12 }, { y: 0, rotation: -6, duration: 0.6, ease: "back.out(1.7)" }, 7.6);
      tl.to("#s3-mono", { rotation: 4, y: 14, duration: 0.6, ease: "sine.inOut", yoyo: true, repeat: 3 }, 8.2);
      ["#z1", "#z2", "#z3"].forEach((id, i) => {
        tl.fromTo(id, { y: 40, opacity: 0 }, { y: -160, opacity: 1, duration: 1.2, ease: "sine.out" }, 8.0 + i * 0.25);
        tl.to(id, { opacity: 0, duration: 0.25 }, 9.22 + i * 0.25);
      });
      tl.fromTo("#s3-l2 .w", { scale: 0.2, opacity: 0, y: 40 }, { scale: 1, opacity: 1, y: 0, duration: 0.5, ease: "back.out(2.6)", stagger: 0.06 }, 8.3);
      /* «aburres.» se desinfla: letras que caen con sueño */
      tl.fromTo("#s3-l2 .ab .ch", { y: -60, opacity: 0 }, { y: 0, opacity: 1, duration: 0.4, ease: "back.out(2)", stagger: 0.04 }, 8.6);
      tl.to("#s3-l2 .ab .ch", { y: 26, rotation: (i) => (i % 2 ? 9 : -7), duration: 0.6, ease: "bounce.out", stagger: 0.05 }, 9.15);
      /* salida */
      speed(9.6);
      move({ s: 1.6, r: -8, x: 240, duration: 0.32, ease: "power3.in" }, 9.62);

      /* ════ ESCENA 4 · 9.9–13.3 · el link que da pena ════ */
      flip(9.9, "#f3ede7", 900, 1050, "#d9d1c8");
      move({ s: 1.3, r: -4, x: 0, duration: 0.01, ease: "none" }, 9.92);
      move({ s: 1, r: 0, duration: 0.8, ease: E }, 9.94);
      tl.fromTo("#s4-al", { x: -160, opacity: 0, scaleX: 1.4 }, { x: 0, opacity: 1, scaleX: 1, duration: 0.3, ease: P4 }, 10.0);
      tl.fromTo("#s4-ar", { x: 160, opacity: 0, scaleX: 1.4 }, { x: 0, opacity: 1, scaleX: 1, duration: 0.3, ease: P4 }, 10.0);
      popWords("#s4-l1", 10.05, 0.05);
      tl.fromTo("#bubble", { scale: 0, opacity: 0, transformOrigin: "0% 100%" }, { scale: 1, opacity: 1, duration: 0.45, ease: "back.out(2.4)" }, 10.45);
      tl.fromTo("#composer", { y: 300, opacity: 0 }, { y: 0, opacity: 1, duration: 0.5, ease: "back.out(1.6)" }, 10.6);
      /* escribe el link, duda sobre «enviar» y lo borra */
      const LINK = "mipagina.com";
      const typing = { n: 0 };
      const writeTyped = () => { document.getElementById("typed").textContent = LINK.slice(0, Math.round(typing.n)); };
      tl.fromTo(typing, { n: 0 }, { n: LINK.length, duration: 0.75, ease: "none", onUpdate: writeTyped }, 10.95);
      move({ s: 1.07, y: -30, duration: 0.8, ease: "power2.inOut" }, 10.95);
      tl.fromTo("#pointer", { x: 1100, y: 1300, opacity: 0 }, { x: 870, y: 1010, opacity: 1, duration: 0.45, ease: "power3.out" }, 11.55);
      tl.to("#pointer", { keyframes: { x: [870, 850, 885, 860, 880, 870] }, duration: 0.5, ease: "none" }, 12.0);
      tl.to("#pointer", { x: 1150, y: 1350, opacity: 0, duration: 0.35, ease: "power3.in" }, 12.5);
      tl.to(typing, { n: 0, duration: 0.4, ease: "none", onUpdate: writeTyped }, 12.4);
      shake(12.45, 14);
      move({ s: 1, y: 0, duration: 0.5, ease: "back.out(1.6)" }, 12.4);
      tl.to("#caret", { keyframes: { opacity: [1, 0, 1, 0, 1, 0, 1, 0, 1] }, duration: 2.2, ease: "none" }, 10.6);
      slamWords("#s4-l2", 12.25);
      tl.fromTo("#s4-under", { scaleX: 0 }, { scaleX: 1, duration: 0.35, ease: P4 }, 12.6);
      /* salida: los ángulos se abren y empuja la cámara */
      speed(12.85);
      move({ s: 2.2, r: 6, duration: 0.3, ease: "power3.in" }, 12.88);

      /* ════ ESCENA 5 · 13.0–16.6 · cierre ════ */
      flip(13.0, "#1b2fcc", 540, 700, "#4a55c4");
      move({ s: 1.4, r: 5, x: 0, y: 0, duration: 0.01, ease: "none" }, 13.02);
      move({ s: 1, r: 0, duration: 0.9, ease: E }, 13.04);
      dropWords("#s5-l1", 13.1, 0.08);
      waveLetters("#s5-l2", 13.55);
      boom(13.85, 540, 720, "#f5e3b3", 10);
      tl.fromTo("#s5-mono", { y: 800, rotation: -10 }, { y: 0, rotation: 0, duration: 0.75, ease: "back.out(1.6)" }, 14.0);
      tl.fromTo("#btn", { scale: 0, opacity: 0, transformOrigin: "0% 50%" }, { scale: 1, opacity: 1, duration: 0.5, ease: "back.out(2.6)" }, 14.35);
      boom(14.5, 330, 980, "#f5e3b3", 5);
      tl.fromTo("#s5-logo", { y: -60, opacity: 0 }, { y: 0, opacity: 1, duration: 0.5, ease: P4 }, 14.8);
      waveLetters("#never", 15.0);
      move({ s: 1.05, duration: 1.4, ease: "sine.inOut" }, 15.2);
      tl.to("#s5-mono", { y: -16, duration: 0.5, ease: "sine.inOut", yoyo: true, repeat: 1 }, 15.4);

      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
