<style>
  @font-face { font-family: "B"; src: url("assets/bricolage.woff2") format("woff2"); font-weight: 200 800; }
  @font-face { font-family: "I"; src: url("assets/instrument-500.woff2") format("woff2"); font-weight: 500; }

<body>
<canvas id="atras" class="mundo" width="1480" height="2320"></canvas>
<div id="cam">
  <div id="mangoW"></div>
  <canvas id="frente" class="mundo" width="1480" height="2320"></canvas>
</div>
<div id="titulo" class="d"></div>
<div id="cierre"><div class="t d" id="cierreTxt"><span id="c1" style="display:block">Una página lenta<br>no avisa:</span><span id="c2" style="display:block"><b>solo pierde ventas.</b></span></div><div class="btn" id="cierreBtn">outstudio.online</div></div>
<script src="elementos.js"></script>

<script>
/* ═══════════ datos y utilidades ═══════════ */
const TINTA = "#2b0d06";
const hash = (i, k) => { const x = Math.sin(i * 127.1 + k * 311.7) * 43758.5453; return x - Math.floor(x); };
const lerp = (a, b, t) => a + (b - a) * t;
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const suave = (a, b, x) => { const u = clamp((x - a) / (b - a)); return u * u * (3 - 2 * u); };
const inOut = (t) => (t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2);
function interp(claves, t) {                         // [[t, valor], ...] con ease in-out entre claves
  if (t <= claves[0][0]) return claves[0][1];
  for (let i = 0; i < claves.length - 1; i++) {
    const [t0, v0] = claves[i], [t1, v1] = claves[i + 1];
    if (t <= t1) return lerp(v0, v1, inOut((t - t0) / (t1 - t0)));
  }
  return claves[claves.length - 1][1];
}
// marcas de tiempo (s) sincronizadas con la voz del narrador (voces/espera-narrador.mp3)
const E = { tap: 1.5, carga0: 2.35, cuelga: 4.1, hora: 5.56, dias: 7.22, carga: 8.68, anio: 9.55, ya: 9.7, mango: 10.3, fin: 15.6 };
const EV = { cuelga: 4.0, hora: 5.5, dias: 9.0, anio: 13.0 };   // tiempos "de mundo" originales del lapso (cielo, plantas, tazas)
const W = (t) => (t < E.cuelga ? t * 4.0 / E.cuelga : t < E.hora ? interp([[E.cuelga, 4.0], [E.hora, 5.5]], t) : t < E.dias ? interp([[E.hora, 5.5], [E.dias, 9.0]], t) : t < E.anio ? interp([[E.dias, 9.0], [E.anio, 13.0]], t) : 13.5);

/* ═══════════ el mundo: hora, clima, crecimiento ═══════════ */
function horaMundo(t) {
  if (t < EV.cuelga) return 10 + t * 0.03;
  if (t < EV.hora) return interp([[EV.cuelga, 10.1], [EV.hora, 11]], t);
  if (t < EV.dias) return interp([[EV.hora, 11], [EV.dias, 83]], t);
  if (t < EV.anio) return 83 + (t - EV.dias) * 90;
  return 13.5;
}
const clima = (t) => ({ lluvia: suave(9.6, 10.0, t) * (1 - suave(10.7, 11.1, t)), nieve: suave(11.0, 11.4, t) * (1 - suave(11.9, 12.3, t)), nubes: 0.3 + 0.5 * suave(9.4, 10, t) * (1 - suave(12, 12.8, t)) });
const crece = (t) => interp([[0, 0.05], [EV.cuelga, 0.1], [EV.hora, 0.18], [EV.dias, 0.55], [EV.anio, 1]], t);
const tazas = (t) => Math.floor(interp([[0, 0], [EV.cuelga, 0], [EV.hora, 1.4], [EV.dias, 6.9], [EV.anio, 17.9]], t));
const telaranas = (t) => suave(EV.hora + 0.8, EV.anio - 0.5, t);

/* ═══════════ dibujo del mundo (estilo plano con contorno, como Mango) ═══════════ */
function contorno(ctx, relleno, ancho = 5) { ctx.fillStyle = relleno; ctx.fill(); ctx.lineWidth = ancho; ctx.strokeStyle = TINTA; ctx.lineJoin = "round"; ctx.stroke(); }
function rect(ctx, x, y, w, h, r, color, ancho) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); contorno(ctx, color, ancho); }

function planta(ctx, x, yBase, g, t) {
  const alto = 150 + g * 760, hojas = Math.floor(3 + g * 15), sway = Math.sin(t * 1.4) * (6 + 14 * g);
  // maceta
  ctx.beginPath(); ctx.moveTo(x - 70, yBase - 120); ctx.lineTo(x + 70, yBase - 120); ctx.lineTo(x + 52, yBase + 20); ctx.lineTo(x - 52, yBase + 20); ctx.closePath(); contorno(ctx, "#bc6039");
  rect(ctx, x - 82, yBase - 138, 164, 36, 10, "#d9784a");
  // tallo
  const pt = (u) => ({ x: x + Math.sin(u * 2.4) * 30 * (0.4 + g) + sway * u * u, y: yBase - 130 - alto * u });
  ctx.beginPath(); for (let i = 0; i <= 20; i++) { const p = pt(i / 20); i ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y); }
  ctx.lineWidth = 10 + 10 * g; ctx.strokeStyle = TINTA; ctx.lineCap = "round"; ctx.stroke(); ctx.lineWidth = 5 + 10 * g; ctx.strokeStyle = "#2f8a3c"; ctx.stroke();
  for (let i = 0; i < hojas; i++) {
    const u = (i + 1) / (hojas + 0.5), p = pt(u), lado = i % 2 ? 1 : -1, tam = (34 + 120 * g) * (1 - u * 0.35) * (0.8 + 0.4 * hash(i, 3));
    ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(lado * (0.9 + 0.2 * Math.sin(t * 1.2 + i)) - (lado > 0 ? 0 : 0.2));
    ctx.beginPath(); ctx.moveTo(0, 0); ctx.quadraticCurveTo(tam * 0.6, -tam * 0.7, tam * 1.6, 0); ctx.quadraticCurveTo(tam * 0.6, tam * 0.7, 0, 0); contorno(ctx, i % 3 ? "#3f9a3a" : "#2c7a2f", 4);
    ctx.beginPath(); ctx.moveTo(tam * 0.1, 0); ctx.lineTo(tam * 1.3, 0); ctx.lineWidth = 3; ctx.strokeStyle = "rgba(43,13,6,.5)"; ctx.stroke(); ctx.restore();
  }
}
function taza(ctx, x, y, i) {
  ctx.save(); ctx.translate(x, y); ctx.scale(1.05, 1.05); ctx.translate(-x, -y);
  rect(ctx, x - 30, y - 56, 60, 56, 10, i % 2 ? "#fbf8f5" : "#f5e3b3", 4);
  ctx.beginPath(); ctx.arc(x + 32, y - 30, 17, -1.2, 1.2); ctx.lineWidth = 8; ctx.strokeStyle = TINTA; ctx.stroke(); ctx.lineWidth = 3.5; ctx.strokeStyle = i % 2 ? "#fbf8f5" : "#f5e3b3"; ctx.stroke();
  ctx.fillStyle = "#5c2a14"; ctx.beginPath(); ctx.ellipse(x, y - 54, 24, 6, 0, 0, 6.29); ctx.fill();
  ctx.restore();
}
function telarana(ctx, x0, y0, sx, sy, a, r) {
  ctx.save(); ctx.globalAlpha = a; ctx.strokeStyle = "rgba(255,255,255,.95)"; ctx.lineWidth = 2.5; ctx.lineCap = "round";
  const n = 6; for (let i = 0; i < n; i++) { const ang = (i / (n - 1)) * (Math.PI / 2); ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x0 + sx * Math.cos(ang) * r, y0 + sy * Math.sin(ang) * r); ctx.stroke(); }
  for (let k = 1; k <= 5; k++) { ctx.beginPath(); for (let i = 0; i < n; i++) { const ang = (i / (n - 1)) * (Math.PI / 2), rr = r * k / 5 * (i % 2 ? 0.9 : 1); const px = x0 + sx * Math.cos(ang) * rr, py = y0 + sy * Math.sin(ang) * rr; i ? ctx.quadraticCurveTo((px + ctx._lx) / 2 - sx * 6, (py + ctx._ly) / 2 - sy * 6, px, py) : ctx.moveTo(px, py); ctx._lx = px; ctx._ly = py; } ctx.stroke(); }
  ctx.restore();
}

const lienzoPantalla = document.createElement("canvas"); lienzoPantalla.width = 236; lienzoPantalla.height = 520;
function dibujarAtras(ctx, t) {
  ctx.setTransform(1, 0, 0, 1, 200, 200); ctx.clearRect(-200, -200, 1480, 2320);
  // pared y zócalo
  ctx.fillStyle = "#f6e8c8"; ctx.fillRect(-200, -200, 1480, 2320);
  ctx.fillStyle = "#ecd7a8"; ctx.fillRect(-200, 1120, 1480, 1000);
  ctx.fillStyle = TINTA; ctx.fillRect(-200, 1118, 1480, 5);
  // ventana con el cielo del mundo
  const wx = 540, wy = 250, ww = 470, wh = 600;
  ctx.save(); ctx.beginPath(); ctx.roundRect(wx, wy, ww, wh, 16); ctx.clip(); ctx.translate(wx, wy);
  Cielo.dibujar(ctx, ww, wh, horaMundo(W(t)), clima(W(t))); ctx.restore();
  ctx.lineWidth = 12; ctx.strokeStyle = "#8d4a2c"; ctx.beginPath(); ctx.roundRect(wx, wy, ww, wh, 16); ctx.stroke();
  ctx.lineWidth = 8; ctx.beginPath(); ctx.moveTo(wx + ww / 2, wy); ctx.lineTo(wx + ww / 2, wy + wh); ctx.moveTo(wx, wy + wh / 2); ctx.lineTo(wx + ww, wy + wh / 2); ctx.stroke();
  ctx.strokeStyle = TINTA; ctx.lineWidth = 4; ctx.beginPath(); ctx.roundRect(wx - 6, wy - 6, ww + 12, wh + 12, 20); ctx.stroke();
  rect(ctx, wx - 24, wy + wh + 4, ww + 48, 30, 8, "#d9784a", 5);
  // reloj de pared
  ctx.save(); ctx.translate(250, 440); ctx.beginPath(); ctx.arc(0, 0, 108, 0, 6.29); contorno(ctx, "#8d4a2c", 6);
  ctx.beginPath(); ctx.arc(0, 0, 92, 0, 6.29); contorno(ctx, "#fbf8f5", 4);
  for (let i = 0; i < 12; i++) { const a = (i / 12) * 6.2832; ctx.beginPath(); ctx.moveTo(Math.sin(a) * 76, -Math.cos(a) * 76); ctx.lineTo(Math.sin(a) * 86, -Math.cos(a) * 86); ctx.lineWidth = 4; ctx.strokeStyle = TINTA; ctx.stroke(); }
  Reloj.dibujar(ctx, 90, horaMundo(W(t))); ctx.restore();
  // planta que crece, detrás de la mesa
  planta(ctx, 150, 1590, crece(W(t)), t);
}

function dibujarFrente(ctx, t) {
  ctx.setTransform(1, 0, 0, 1, 200, 200); ctx.clearRect(-200, -200, 1480, 2320);
  // mesa
  ctx.fillStyle = "#8d4a2c"; ctx.fillRect(-210, 1620, 1500, 520); ctx.strokeStyle = TINTA; ctx.lineWidth = 5; ctx.strokeRect(-210, 1620, 1500, 520);
  ctx.fillStyle = "rgba(43,13,6,.18)"; for (let i = -1; i < 8; i++) ctx.fillRect(40 + i * 160, 1680, 6, 440);
  rect(ctx, -220, 1556, 1520, 74, 14, "#bc6039", 6);
  ctx.fillStyle = "rgba(255,255,255,.22)"; ctx.fillRect(-190, 1566, 1460, 10);
  // tazas que se acumulan (torres)
  const n = tazas(W(t));
  for (let i = 0; i < Math.min(n, 14); i++) { const torre = Math.floor(i / 7), piso = i % 7; taza(ctx, 62 + torre * 78 + (piso % 2) * 5, 1556 - piso * 55, i); }   // dos torres en la esquina, lejos de la cara
  // celular de pie con la pantalla hacia la cámara
  const fase = t < 2.3 ? "producto" : t < E.anio ? "cargando" : "agotado";
  const prog = t < E.carga ? 0.05 + 0.1 * clamp((t - 2.3) / (E.carga - 2.3)) : t < E.anio ? lerp(0.15, 1, (t - E.carga) / (E.anio - E.carga)) : 1;
  Pantalla.dibujar(lienzoPantalla.getContext("2d"), 236, 520, { fase: t >= E.anio ? "agotado" : fase, t, progreso: prog });
  ctx.save(); ctx.translate(900, 1568); ctx.rotate(-0.06);
  rect(ctx, -138, -600, 276, 600, 38, "#141e5c", 6);
  ctx.save(); ctx.beginPath(); ctx.roundRect(-118, -580, 236, 520, 22); ctx.clip(); ctx.drawImage(lienzoPantalla, -118, -580); ctx.restore();
  ctx.fillStyle = "#0b1038"; ctx.beginPath(); ctx.arc(0, -592, 6, 0, 6.29); ctx.fill();
  // el dedo que toca «Comprar»
  if (t > 1.5 && t < 2.3) { const k = suave(1.5, 1.9, t) * (1 - suave(2.0, 2.3, t)); ctx.globalAlpha = k; ctx.fillStyle = "rgba(20,30,92,.35)"; ctx.strokeStyle = "#141e5c"; ctx.lineWidth = 6; ctx.beginPath(); ctx.arc(0, -118 - 30 * (1 - suave(1.5, 1.9, t)), 36 * (1.3 - 0.3 * suave(1.85, 2.0, t)), 0, 6.29); ctx.fill(); ctx.stroke(); ctx.globalAlpha = 1; }
  ctx.restore();
  // enredadera que sube por la mesa
  const v = suave(E.dias, E.anio, t);
  if (v > 0) { ctx.strokeStyle = TINTA; ctx.lineWidth = 16; ctx.lineCap = "round"; ctx.beginPath(); for (let i = 0; i <= 40; i++) { const u = i / 40 * v; const x = 40 + u * 700, y = 1560 + Math.sin(u * 14) * 18; i ? ctx.lineTo(x, y) : ctx.moveTo(x, y); } ctx.stroke(); ctx.strokeStyle = "#2f8a3c"; ctx.lineWidth = 9; ctx.stroke();
    for (let i = 0; i < 12; i++) { const u = (i + 1) / 13; if (u > v) break; const x = 40 + u * 700, y = 1560 + Math.sin(u * 14) * 18; ctx.save(); ctx.translate(x, y); ctx.rotate(-1 + (i % 2) * 2); ctx.beginPath(); ctx.moveTo(0, 0); ctx.quadraticCurveTo(26, -20, 56, 0); ctx.quadraticCurveTo(26, 20, 0, 0); contorno(ctx, "#3f9a3a", 4); ctx.restore(); } }
  // telarañas en las esquinas
  const a = telaranas(W(t));
  if (a > 0) { telarana(ctx, -40, 0, 1, 1, a, 360 * a + 80); telarana(ctx, 1120, 0, -1, 1, a, 320 * a + 60); telarana(ctx, -40, 1500, 1, -1, a, 220 * a); telarana(ctx, 1000, 1000, -1, 1, a, 200 * a); }
  // páginas de calendario que vuelan
  const MESES = ["ENE", "FEB", "MAR", "ABR", "MAY", "JUN", "JUL", "AGO", "SEP", "OCT", "NOV", "DIC"];
  for (let i = 0; i < 24; i++) {
    const ts = E.hora + 0.05 + i * 0.13, d = (t - ts) / 0.9; if (d < 0 || d > 1) continue;
    const x = lerp(1180, -160, d), y = 640 + hash(i, 1) * 560 + Math.sin(d * 7) * 70, rot = (d * 3 + hash(i, 2)) * 2.4;
    ctx.save(); ctx.translate(x, y); ctx.rotate(rot); rect(ctx, -52, -62, 104, 124, 8, "#fbf8f5", 4); ctx.fillStyle = "#bc6039"; ctx.fillRect(-52, -62, 104, 34); ctx.fillStyle = "#fbf8f5"; ctx.font = "800 24px B, sans-serif"; ctx.textAlign = "center"; ctx.fillText(MESES[i % 12], 0, -36); ctx.fillStyle = TINTA; ctx.font = "800 44px B, sans-serif"; ctx.fillText(String(1 + ((i * 7) % 28)), 0, 24); ctx.restore();
  }
}

/* ═══════════ Mango: el único cutout ═══════════ */
const IDX = {}; ["m", "o", "a", "e"].forEach((n) => (IDX[n] = { x: 450, y: 600 }));
const OJOS = ["ojos-abiertos", "entreabiertos", "mirada-izq", "mirada-der", "mirada-arriba", "parpadeo"];
const m = MangoRig.crear(document.getElementById("mangoW"), { webgl: true, bocas: { carpeta: "bocas", indice: IDX }, ojos: { carpeta: "ojos", x: 330, y: 300, ancho: 640, alto: 320, nombres: OJOS } });
const PASO = 2;
// expresión de ojos en el tiempo: [desde, ojos]
const LINEA_OJOS = [[0, "ojos-abiertos"], [0.8, "entreabiertos"], [1.5, "mirada-der"], [3.3, "entreabiertos"], [5.1, "mirada-arriba"], [6.2, "entreabiertos"], [7.7, "mirada-arriba"], [8.4, "entreabiertos"], [9.0, "mirada-der"], [9.55, "ojos-abiertos"]];
const PARP = [0.8, 1.5, 3.3, 5.1, 6.2, 7.7, 8.4, 9.0, 9.55];    // un parpadeo antes de cada cambio de expresión
function ojosEn(f) {
  const t = f / 24; let n = "entreabiertos"; for (const [t0, o] of LINEA_OJOS) if (t >= t0) n = o;
  for (const b of PARP) { const fb = Math.round(b * 24 / PASO) * PASO, d = f - fb; if (d >= -2 * PASO && d < -PASO) return "entreabiertos"; if (d >= -PASO && d < PASO) return "parpadeo"; }
  return n;
}
function bocaEn(t) { return t >= E.ya && t < E.ya + 0.45 ? "a" : t >= E.ya + 0.45 && t < E.mango + 0.3 ? "o" : "m"; }
const lienzoAtras = document.getElementById("atras").getContext("2d"), lienzoFrente = document.getElementById("frente").getContext("2d");
const mW = document.getElementById("mangoW"), cam = document.getElementById("cam");

/* ═══════════ cámara ═══════════ */
// planos de cámara: [t, zoom, x, y] (centro del encuadre en el mundo). Entre claves, ease in-out; claves juntas = barrido rápido
const PLANOS = [
  [0.0, 1.0, 540, 1000], [1.35, 1.18, 590, 1300],            // abre en plano general: Mango y el celular
  [1.75, 1.9, 880, 1260], [2.7, 1.9, 880, 1260],            // toque en «Comprar»: golpe de zoom al celular
  [3.4, 1.05, 560, 1180], [4.9, 1.05, 560, 1180],            // vuelve atrás: el spinner da vueltas
  [5.6, 1.4, 330, 720], [6.3, 1.45, 310, 740],               // barrido al reloj de pared
  [6.8, 1.5, 270, 1400], [7.2, 1.55, 280, 1390],             // baja a la torre de tazas
  [7.8, 1.3, 620, 790], [8.35, 1.35, 640, 800],              // sube a la ventana: llueve, nieva
  [8.9, 1.0, 540, 960], [9.1, 1.0, 540, 960],                // plano general: todo cubierto
  [9.45, 1.9, 880, 1260], [9.7, 1.9, 880, 1260],             // empuje al celular: «Agotado»
  [9.95, 2.1, 380, 1340], [10.5, 2.2, 380, 1340], [10.8, 1.0, 540, 960],   // látigo a la cara de Mango
];
function camara(t) {
  let a = PLANOS[0], b = PLANOS[PLANOS.length - 1];
  if (t <= a[0]) b = a; else if (t >= b[0]) a = b; else for (let i = 0; i < PLANOS.length - 1; i++) if (t <= PLANOS[i + 1][0]) { a = PLANOS[i]; b = PLANOS[i + 1]; break; }
  const u = a === b ? 1 : inOut((t - a[0]) / (b[0] - a[0]));
  const s = lerp(a[1], b[1], u);
  return { s, x: lerp(a[2], b[2], u) + 9 * Math.sin(t * 0.8) / s, y: lerp(a[3], b[3], u) + 7 * Math.sin(t * 1.15 + 1) / s };
}
function pinta(t, f) {
  const tq = Math.floor(f / PASO) * PASO / 24;
  dibujarAtras(lienzoAtras, t); dibujarFrente(lienzoFrente, t);
  // temblor al ver «Agotado»
  const tr = t - E.ya, tem = tr > 0 && tr < 1.2 ? Math.exp(-tr * 3) : 0, tx = Math.sin(t * 90) * 14 * tem, ty = Math.cos(t * 77) * 10 * tem;
  const c0 = camara(t), c1 = camara(t - 1 / 24), vel = Math.hypot(c0.x - c1.x, c0.y - c1.y) * c0.s + Math.abs(c0.s - c1.s) * 600;
  const s = c0.s, cx = c0.x, cy = c0.y, sb = 1 + (s - 1) * 0.8;
  const desenfoque = Math.min(8, Math.max(0, (vel - 16) * 0.22));
  cam.style.transform = `translate(${540 - cx * s + tx}px, ${960 - cy * s + ty}px) scale(${s})`;
  lienzoAtras.canvas.style.transform = `translate(${540 - cx * sb + tx}px, ${960 - cy * sb + ty}px) scale(${sb})`;
  document.body.style.filter = desenfoque > 0.4 ? `blur(${desenfoque.toFixed(1)}px)` : "none";
  // Mango (a doses): ojos, boca, giro y cabeceo
  m.bocaImg(bocaEn(tq)); m.ojos(ojosEn(f - (f % PASO)));
  const sueno = suave(E.hora, E.anio, tq);
  const yaw = (tq > 1.5 && tq < E.anio ? 0.55 : 0) * (1 - 0.5 * sueno) + 0.2 * Math.sin(tq * 0.8) - (tq > E.ya ? 0.6 : 0);
  const pitch = 0.06 * Math.sin(tq * 1.3) + 0.22 * sueno * Math.sin(tq * 1.7) - 0.12 * suave(E.ya - 0.2, E.ya, tq);
  m.girar(yaw, pitch);
  const rot = 2 * Math.sin(tq * 0.9) + 6 * sueno * Math.sin(tq * 1.3) + (tq > E.ya ? 4 * Math.sin(tq * 60) * tem : 0);
  const salto = tq > E.ya - 0.05 && tq < E.ya + 0.4 ? 14 * Math.sin(((tq - E.ya + 0.05) / 0.45) * Math.PI) : 0;
  mW.style.transform = `translate(${380 - 627}px, ${1370 - 627 - salto + 3 * Math.sin(tq * 1.6)}px) rotate(${rot}deg) scale(0.4)`;
  // textos
  const R = [[0, E.cuelga, "POV: tu página carga lento"], [E.cuelga, E.hora, "Una hora después."], [E.hora, E.dias, "Tres días después."], [E.dias, E.carga, "Un año después."], [E.carga, E.mango, "Por fin cargó."]];
  const fila = R.find((r) => t >= r[0] && t < r[1]); const rotulo = fila ? fila[2] : "", t0 = fila ? fila[0] : 0;
  const el = document.getElementById("titulo"); if (el.dataset.txt !== rotulo) { el.dataset.txt = rotulo; el.innerHTML = rotulo.split(" ").map((w) => `<span>${w}</span>`).join(" "); }
  el.style.opacity = rotulo ? 1 : 0;
  [...el.children].forEach((sp, i) => { const u = clamp((t - t0 - i * 0.07) / 0.25); sp.style.transform = `translateY(${(1 - Math.pow(1 - u, 3)) * -50 * (1 - u)}px) scale(${0.6 + 0.4 * u})`; sp.style.opacity = u; });
  // cierre sincronizado con la voz: «Una página lenta no avisa:» 10.45, «solo pierde ventas.» 12.45, «Escríbenos.» 14.14
  const c = suave(E.mango, E.mango + 0.3, t); const cierre = document.getElementById("cierre"); cierre.style.opacity = c;
  const pop = (a, d = 0.35) => { const u = clamp((t - a) / d); return { o: u, tr: `translateY(${(1 - Math.pow(1 - u, 3)) * 40 * (1 - u)}px) scale(${0.85 + 0.15 * u})` }; };
  const l1 = pop(10.45), l2 = pop(12.45), bt = pop(14.1, 0.3);
  const a1 = document.getElementById("c1"), a2 = document.getElementById("c2");
  a1.style.opacity = l1.o; a1.style.transform = l1.tr; a2.style.opacity = l2.o; a2.style.transform = l2.tr;
  const b = document.getElementById("cierreBtn"); b.style.opacity = bt.o; b.style.transform = `scale(${0.6 + 0.4 * bt.o * (1 + 0.12 * Math.sin(bt.o * Math.PI))})`;
}
