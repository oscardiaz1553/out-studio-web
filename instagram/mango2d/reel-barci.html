<!doctype html>
<html lang="es"><head><meta charset="utf-8"><title>Mango estrena la tienda de BARCI</title>
<style>
  @font-face { font-family: "B"; src: url("assets/bricolage.woff2") format("woff2"); font-weight: 200 800; }
  @font-face { font-family: "I"; src: url("assets/instrument-500.woff2") format("woff2"); font-weight: 500; }
  @font-face { font-family: "L"; src: url("assets/barci/lora.woff2") format("woff2"); font-weight: 400; }
  * { margin: 0; box-sizing: border-box; }
  body { width: 1080px; height: 1920px; overflow: hidden; position: relative; background: #efe6da; font-family: "I", sans-serif; }
  .d { font-family: "B", sans-serif; font-weight: 800; letter-spacing: -0.045em; line-height: 0.94; }
  .bg { position: absolute; inset: 0; }
  .it { position: absolute; will-change: transform, opacity; }
  .foto { border-radius: 30px; overflow: hidden; box-shadow: 0 24px 50px rgba(30,12,6,.28); background: #ddd; }
  .foto img { width: 100%; height: 100%; object-fit: cover; display: block; }
  #mangoW { position: absolute; left: 0; top: 0; width: 1254px; height: 1254px; transform-origin: 627px 627px; }
  #titulo { position: absolute; left: 70px; right: 70px; top: 130px; text-align: center; font-size: 104px; }
  #titulo span { display: inline-block; }
  .pill { font: 800 44px "B"; letter-spacing: -0.03em; padding: 16px 38px; border-radius: 60px; white-space: nowrap; }
  .banda { position: absolute; left: -20px; right: -20px; height: 86px; background: #cdbfae; border-top: 4px solid #3a2118; border-bottom: 4px solid #3a2118; overflow: hidden; white-space: nowrap; font: 800 44px/78px "B"; letter-spacing: -0.02em; color: #3a2118; }
  #cierre { position: absolute; inset: 0; background: #1b2fcc; opacity: 0; overflow: hidden; }
  #cierre canvas { position: absolute; left: 0; top: 0; }
  #cierre .fila { position: absolute; left: 0; right: 0; text-align: center; color: #fbf8f5; white-space: nowrap; }
  #cierre .m { display: inline-block; overflow: hidden; vertical-align: bottom; padding: 0 0.12em 0.14em; margin: 0 -0.08em; }
  #cierre .m i { display: inline-block; font-style: normal; }
  #cierre .btn { position: absolute; left: 50%; top: 1180px; margin-left: -290px; width: 580px; text-align: center; background: #f5e3b3; color: #1b2fcc; font-size: 56px; padding: 32px 0; border-radius: 999px; font-weight: 500; }
</style></head>
<body>
<div id="fondos"></div>
<div id="piezas"></div>
<div id="mangoW"></div>
<div id="titulo" class="d"></div>
<div id="cierre">
  <canvas id="cbg" width="1080" height="1920"></canvas>
  <div class="fila d" id="a1" style="top:600px;font-size:128px"></div>
  <div class="fila d" id="a2" style="top:740px;font-size:128px"></div>
  <div class="fila d" id="c2" style="top:1000px;font-size:104px;color:#f5e3b3"></div>
  <div class="btn" id="cierreBtn">outstudio.online</div>
</div>
<script src="rig.js"></script>
<script>
/* ═══════════ utilidades ═══════════ */
const lerp = (a, b, t) => a + (b - a) * t;
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const suave = (a, b, x) => { const u = clamp((x - a) / (b - a)); return u * u * (3 - 2 * u); };
const easeOutExpo = (u) => (u >= 1 ? 1 : 1 - Math.pow(2, -10 * u));
const easeOutBack = (u) => { const c = 1.70158; return 1 + (c + 1) * Math.pow(u - 1, 3) + c * Math.pow(u - 1, 2); };
const A = (n) => `assets/barci/${n}`;

/* ═══════════ tiempos (s): se ajustan a la voz del narrador (voces/barci-narrador.mp3) ═══════════ */
const E = { l: [0.3, 2.0, 4.0, 6.4, 9.4, 12.6], cierre: 15.6, fin: 19.4 };   // inicio de cada frase (provisional)
const BEATS = [   // fondo, color del rótulo, rótulo
  { t0: 0, t1: E.l[1], bg: "#efe6da", ink: "#3a2118", cap: "Esta es BARCI." },
  { t0: E.l[1], t1: E.l[2], bg: "#3a2118", ink: "#efe6da", cap: "Moda femenina colombiana." },
  { t0: E.l[2], t1: E.l[3], bg: "#efe6da", ink: "#3a2118", cap: "Básicos, cápsulas y accesorios." },
  { t0: E.l[3], t1: E.l[4], bg: "#d8c9b7", ink: "#3a2118", cap: "No cabe en una sola forma." },
  { t0: E.l[4], t1: E.l[5], bg: "#3a2118", ink: "#efe6da", cap: "Y una cápsula: Brava." },
  { t0: E.l[5], t1: E.cierre, bg: "#1b2fcc", ink: "#fbf8f5", cap: "En 4 semanas ya vendía." },
];

/* ═══════════ piezas: cada una vive dentro de su escena y entra con su propio movimiento ═══════════ */
const piezas = [];   // { el, b (escena), t0, x, y, w, h, rot, de: 'abajo'|'izq'|'der'|'arriba'|'escala'|'giro', dur, fn }
const raiz = document.getElementById("piezas");
function foto(nombre, o) {
  const el = document.createElement("div"); el.className = "it foto"; el.style.cssText = `left:${o.x}px;top:${o.y}px;width:${o.w}px;height:${o.h}px;border-radius:${o.r ?? 30}px`;
  el.innerHTML = `<img src="${A(nombre)}" style="object-position:${o.pos || "50% 50%"}">`; raiz.appendChild(el); piezas.push({ el, ...o }); return el;
}
function caja(html, estilo, o) { const el = document.createElement("div"); el.className = "it"; el.style.cssText = estilo; el.innerHTML = html; raiz.appendChild(el); piezas.push({ el, ...o }); return el; }

// 1 · Esta es BARCI: el logo con el símbolo (flor de infinito) girando detrás
caja(`<img src="${A("favicon-512x512.png")}" style="width:1000px;opacity:.1;display:block">`, "left:40px;top:260px;width:1000px", { b: 0, t0: 0.2, de: "escala", dur: 1.0, giro: 14, ancla: [500, 500] });
caja(`<img src="${A("logo-barci.png")}" style="width:800px;display:block">`, "left:140px;top:560px;width:800px", { b: 0, t0: 0.35, de: "escala", dur: 0.7 });
caja(`<span style="font:400 64px 'L';color:#3a2118;font-style:italic">Infinitas formas de ser tú</span>`, "left:0;right:0;top:960px;text-align:center", { b: 0, t0: 1.0, de: "abajo", dur: 0.6 });
// 2 · Moda femenina colombiana: tres fotos que entran de lado + banda de envíos que corre
[["bar-004-tank-top-serena-2.jpg", 50, 440, "izq", -5, 0.0], ["bar-006-camisa-basic-1.jpg", 380, 400, "abajo", 2, 0.2], ["bar-003-croptop-alma-1.jpg", 710, 440, "der", 5, 0.4]].forEach(([n, x, y, de, rot, d]) => foto(n, { b: 1, x, y, w: 320, h: 560, rot, t0: E.l[1] + 0.15 + d, de, dur: 0.7 }));
const marq = "ENVÍOS A TODA COLOMBIA  ✿  HECHO EN COLOMBIA  ✿  ".repeat(6);
caja(`<div class="marq" style="width:max-content">${marq}</div>`, "left:-20px;right:-20px;top:1130px;height:86px;background:#cdbfae;border-top:4px solid #3a2118;border-bottom:4px solid #3a2118;overflow:hidden;white-space:nowrap;font:800 44px/78px 'B';letter-spacing:-0.02em;color:#3a2118", { b: 1, t0: E.l[1] + 0.3, de: "izq", dur: 0.6, marq: -260, clase: "banda" });
// 3 · Básicos, cápsulas y accesorios: tres tarjetas con su etiqueta
[["Básicos", "bar-001-tshirt-barci-1.jpg", 50, 0.15], ["Cápsulas", "brv-005-tank-libre-1.jpg", 380, 0.75], ["Accesorios", "bar-009-panoleta-aura-1.jpg", 710, 1.35]].forEach(([t, n, x, d]) => {
  foto(n, { b: 2, x, y: 420, w: 320, h: 580, rot: 0, t0: E.l[2] + 0.1 + d, de: "escala", dur: 0.6 });
  caja(`<span class="pill" style="background:#3a2118;color:#efe6da">${t}</span>`, `left:${x}px;top:1040px;width:320px;text-align:center`, { b: 2, t0: E.l[2] + 0.3 + d, de: "abajo", dur: 0.5 });
});
// 4 · No cabe en una sola forma: la frase de la marca y una tira de productos que no para
caja(`<span style="font:400 88px/1.12 'L';color:#3a2118;display:block;text-align:center">Tu estilo no tiene que encajar en una categoría:<br><i>tiene que sentirse tuyo.</i></span>`, "left:70px;right:70px;top:380px", { b: 3, t0: E.l[3] + 0.2, de: "abajo", dur: 0.9 });
const tira = ["bar-004-tank-top-serena-2.jpg", "brv-004-tank-rebelde-1.jpg", "bar-007-gorra-nativa-2.jpg", "brv-001-panoleta-horse-1.jpg", "bar-006-camisa-basic-1.jpg", "bar-008-pava-brisa-2.jpg", "bar-001-tshirt-barci-1.jpg", "brv-003-bandana-brava-1.jpg"];
caja(`<div class="tira" style="display:flex;gap:22px;width:max-content">${[...tira, ...tira, ...tira].map((n) => `<div class="foto" style="width:260px;height:340px;flex:none;border-radius:26px"><img src="${A(n)}"></div>`).join("")}</div>`, "left:0;right:0;top:960px;height:340px;overflow:hidden", { b: 3, t0: E.l[3] + 1.4, de: "der", dur: 0.7, marq: -150, clase: "tira" });
// 5 · Brava: el banner y cuatro productos
foto("Banner-Brava.jpg", { b: 4, x: 60, y: 380, w: 960, h: 426, rot: 0, t0: E.l[4] + 0.1, de: "escala", dur: 0.8, zoom: 0.08 });
[["brv-001-panoleta-horse-1.jpg", 60], ["brv-002-panoleta-brava-1.jpg", 305], ["brv-003-bandana-brava-1.jpg", 550], ["brv-004-tank-rebelde-1.jpg", 795]].forEach(([n, x], i) => foto(n, { b: 4, x, y: 860, w: 230, h: 390, rot: (i % 2 ? 2 : -2), t0: E.l[4] + 0.9 + i * 0.28, de: "abajo", dur: 0.6, r: 24 }));
// 6 · 4 semanas: contador, línea de tiempo y sello
const S = E.l[5];
caja(`<div class="num d" style="font-size:520px;color:#f5e3b3;text-align:center;line-height:.8">1</div>`, "left:0;right:0;top:400px", { b: 5, t0: S + 0.1, de: "escala", dur: 0.6, num: true });
caja(`<div class="d" style="font-size:120px;color:#fbf8f5;text-align:center">semanas</div>`, "left:0;right:0;top:880px", { b: 5, t0: S + 0.3, de: "abajo", dur: 0.6 });
caja(`<div class="linea"></div>`, "left:0;top:0;width:1080px;height:1920px", { b: 5, t0: S + 0.2, de: "nada", dur: 0.01, linea: true });
caja(`<span class="pill" style="background:#f5e3b3;color:#1b2fcc;font-size:52px">Al aire y vendiendo</span>`, "left:0;right:0;top:1260px;text-align:center", { b: 5, t0: S + 2.3, de: "escala", dur: 0.5 });

// fondos con cortina
const fondos = BEATS.map((b) => { const d = document.createElement("div"); d.className = "bg"; d.style.background = b.bg; document.getElementById("fondos").appendChild(d); return d; });

/* ═══════════ Mango: el único cutout ═══════════ */
const OJOS = ["ojos-abiertos", "entreabiertos", "mirada-izq", "mirada-der", "mirada-arriba", "parpadeo"];
const m = MangoRig.crear(document.getElementById("mangoW"), { webgl: true, bocas: { carpeta: "bocas", indice: { m: { x: 450, y: 600 } } }, ojos: { carpeta: "ojos", x: 330, y: 300, ancho: 640, alto: 320, nombres: OJOS } });
const PASO = 2;
const LINEA_OJOS = [[0, "ojos-abiertos"], [0.8, "entreabiertos"], [E.l[2], "mirada-izq"], [E.l[3] - 0.3, "entreabiertos"], [E.l[4], "mirada-der"], [E.l[5] - 0.3, "ojos-abiertos"], [14.6, "entreabiertos"]];
const PARP = [0.8, E.l[2], E.l[3] - 0.3, E.l[4], E.l[5] - 0.3, 14.6];
function ojosEn(f) {
  const t = f / 24; let n = "entreabiertos"; for (const [t0, o] of LINEA_OJOS) if (t >= t0) n = o;
  for (const b of PARP) { const fb = Math.round(b * 24 / PASO) * PASO, d = f - fb; if (d >= -2 * PASO && d < -PASO) return "entreabiertos"; if (d >= -PASO && d < PASO) return "parpadeo"; }
  return n;
}
const mW = document.getElementById("mangoW");

/* ═══════════ cuadro a cuadro ═══════════ */
function pinta(t, f) {
  const tq = Math.floor(f / PASO) * PASO / 24;
  // fondos: cada escena entra con una cortina que sube
  const kb = BEATS.findIndex((b) => t >= b.t0 && t < b.t1);
  fondos.forEach((d, i) => { const u = i === 0 ? 1 : easeOutExpo(clamp((t - BEATS[i].t0) / 0.55)); d.style.clipPath = `inset(${(1 - u) * 100}% 0 0 0)`; d.style.display = t >= BEATS[i].t0 ? "block" : "none"; });
  // rótulo (Out) de cada escena
  const b = BEATS[Math.max(0, kb)], titulo = document.getElementById("titulo");
  if (titulo.dataset.txt !== b.cap) { titulo.dataset.txt = b.cap; titulo.innerHTML = b.cap.split(" ").map((w) => `<span>${w}</span>`).join(" "); }
  titulo.style.color = b.ink; titulo.style.opacity = kb >= 0 ? 1 : 0;
  [...titulo.children].forEach((sp, i) => { const u = clamp((t - b.t0 - 0.15 - i * 0.07) / 0.28); sp.style.transform = `translateY(${(1 - Math.pow(1 - u, 3)) * -50 * (1 - u)}px) scale(${0.6 + 0.4 * u})`; sp.style.opacity = u; });
  // piezas
  piezas.forEach((p) => {
    const fin = BEATS[p.b].t1, u = clamp((t - p.t0) / (p.dur || 0.6)), e = easeOutExpo(u), sal = clamp((t - fin) / 0.35);
    const vis = t >= p.t0 && t < fin + 0.4; p.el.style.display = vis ? "block" : "none"; if (!vis) return;
    let dx = 0, dy = 0, sc = 1, rot = p.rot || 0;
    if (p.de === "abajo") dy = (1 - e) * 220; else if (p.de === "arriba") dy = -(1 - e) * 220; else if (p.de === "izq") dx = -(1 - e) * 1200; else if (p.de === "der") dx = (1 - e) * 1200;
    else if (p.de === "escala") sc = 0.4 + 0.6 * easeOutBack(u);
    if (p.giro) rot += t * p.giro;
    dy += -sal * 200 * (p.b === 5 ? 0 : 1); sc *= 1 - 0.1 * sal;
    p.el.style.opacity = clamp(u * 3) * (1 - sal); p.el.style.transformOrigin = p.ancla ? `${p.ancla[0]}px ${p.ancla[1]}px` : "50% 50%";
    p.el.style.transform = `translate(${dx}px,${dy}px) rotate(${rot}deg) scale(${sc})`;
    if (p.marq) { const c = p.el.firstElementChild; const per = c.scrollWidth / (p.clase === "tira" ? 3 : 6); c.style.transform = `translateX(${(t * p.marq) % per}px)`; }
    if (p.zoom) p.el.firstElementChild.style.transform = `scale(${1 + p.zoom * u})`;
    if (p.num) { const k = clamp(Math.floor((t - (S + 0.6)) / 0.5) + 1, 1, 4), ult = S + 0.6 + (k - 1) * 0.5; p.el.firstElementChild.textContent = k; p.el.firstElementChild.style.transform = `scale(${1 + 0.18 * Math.max(0, 1 - (t - ult) * 5)})`; }
    if (p.linea) { const el = p.el.firstElementChild; if (!el.dataset.ok) { el.dataset.ok = 1; el.innerHTML = `<svg width="1080" height="1920" style="position:absolute;left:0;top:0"><line x1="150" y1="1160" x2="930" y2="1160" stroke="rgba(251,248,245,.35)" stroke-width="10" stroke-linecap="round"/><line id="prog" x1="150" y1="1160" x2="150" y2="1160" stroke="#f5e3b3" stroke-width="10" stroke-linecap="round"/></svg>` + [0, 1, 2, 3].map((i) => `<div class="nodo" style="position:absolute;left:${150 + i * 260 - 38}px;top:${1160 - 38}px;width:76px;height:76px;border-radius:50%;background:#1b2fcc;border:8px solid #fbf8f5;color:#fbf8f5;font:800 28px/60px 'B';text-align:center">S${i + 1}</div>`).join(""); }
      const prog = (t - (S + 0.6)) / 0.5; const kk = clamp(prog, 0, 3); el.querySelector("#prog").setAttribute("x2", 150 + kk * 260);
      el.querySelectorAll(".nodo").forEach((n, i) => { const on = clamp(prog - i + 0.0); n.style.background = on > 0.5 ? "#f5e3b3" : "#1b2fcc"; n.style.color = on > 0.5 ? "#1b2fcc" : "#fbf8f5"; n.style.transform = `scale(${1 + 0.25 * Math.sin(clamp(on) * Math.PI) * (on > 0 && on < 1 ? 1 : 0)})`; });
    }
  });
  // Mango (a doses): sube desde abajo al inicio, mira lo que se muestra y reacciona a las 4 semanas
  m.bocaImg("m"); m.ojos(ojosEn(f - (f % PASO)));
  const rea = suave(S - 0.1, S + 0.25, tq) * (1 - suave(14.6, 15.0, tq));
  m.girar(0.18 * Math.sin(tq * 0.9) * (1 - rea) - 0.0, 0.05 * Math.sin(tq * 1.3) - 0.1 * rea);
  const salto = tq > S - 0.05 && tq < S + 0.4 ? 22 * Math.sin(((tq - S + 0.05) / 0.45) * Math.PI) : 0;
  const sube = 1 - easeOutBack(clamp((tq - 0.1) / 0.7));
  mW.style.transform = `translate(${540 - 627}px, ${1700 - 627 - salto + 4 * Math.sin(tq * 1.6) + sube * 600}px) rotate(${2 * Math.sin(tq * 0.9)}deg) scale(0.52)`;
  cierreFx(t);
}

/* ═══════════ cierre: motion graphics ═══════════ */
function palabras(id, lista) { const el = document.getElementById(id); if (el.dataset.ok) return el.querySelectorAll("i"); el.dataset.ok = 1; el.innerHTML = lista.map(([w]) => `<span class="m"><i>${w}</i></span>`).join(" "); return el.querySelectorAll("i"); }
const C0 = E.cierre;
const L = { a1: [["¿Tu", C0 + 0.1], ["marca", C0 + 0.28]], a2: [["necesita", C0 + 0.55], ["la", C0 + 0.8], ["suya?", C0 + 0.9]], c2: [["Escríbenos.", C0 + 2.0]] };
function subir(id, t, y0 = 120) { const is = palabras(id, L[id]); is.forEach((e, k) => { const u = clamp((t - L[id][k][1]) / 0.55), v = easeOutExpo(u); e.style.transform = `translateY(${(1 - v) * y0}%) rotate(${(1 - v) * 7}deg)`; e.style.opacity = u > 0 ? 1 : 0; }); }
function cierreFx(t) {
  const cierre = document.getElementById("cierre"), r = easeOutExpo(clamp((t - C0) / 0.55)) * 1750;
  cierre.style.opacity = t >= C0 ? 1 : 0; cierre.style.clipPath = `circle(${r}px at 540px 960px)`;
  const g = document.getElementById("cbg").getContext("2d"); g.clearRect(0, 0, 1080, 1920);
  for (let k = 0; k < 5; k++) { const u = (Math.max(0, t - C0) * 0.16 + k / 5) % 1; g.strokeStyle = `rgba(245,227,179,${0.14 * (1 - u)})`; g.lineWidth = 6; g.beginPath(); g.arc(540, 960, 120 + u * 1100, 0, 6.2832); g.stroke(); }
  subir("a1", t); subir("a2", t); subir("c2", t);
  const bt = clamp((t - (C0 + 2.3)) / 0.6), btn = document.getElementById("cierreBtn");
  btn.style.opacity = bt > 0 ? 1 : 0; btn.style.transform = `translateY(${(1 - easeOutExpo(bt)) * 90}px) scale(${0.5 + 0.5 * easeOutBack(bt)})`;
}
window.render = (t) => { pinta(t, Math.floor(t * 24 + 1e-6)); };
window.cargar = async () => {
  await m.cargado();
  await Promise.all([...document.images].map((i) => (i.complete ? 0 : new Promise((r) => { i.onload = i.onerror = r; }))));
  await document.fonts.ready; return m.listo;
};
</script></body></html>
